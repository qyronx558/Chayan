name: CI

# Runs on every pull request to main (and on pushes to main). Make the
# "CI passed" job a required status check so a PR can only merge when
# lint, type checks and tests (with the coverage gate) all pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Fake values only - tests never talk to a real database or provider.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: ESLint (no errors, warnings must not grow)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Tests & coverage (min 35%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Unit + integration tests with coverage gate
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage (gate: 35%)", "", "| Metric | % | Covered |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python flows (uv, ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python tools
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest (min 35% coverage)
        run: uv run pytest

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} python=${{ needs.python.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.python.result }}" = success
