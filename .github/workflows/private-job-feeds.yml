name: private-job-feeds

# Syncs company job boards (Admin → Job feeds) inside GitHub Actions, straight
# against the database, so the heavy fetch / parse / upsert work never runs on
# Vercel. One POST to /api/cron/revalidate refreshes the affected pages after.
#
# Secrets (Production environment): DATABASE_URL, APP_URL, CRON_SECRET, GEMINI_API_KEY (optional).
#
# It also retries contact notifications that failed at submit time (the job that
# used to be the 15-minute contact-delivery cron): a psql check against the
# database first, and the site is only called when a ticket is actually waiting.

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

concurrency:
  group: private-job-feeds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Forks' scheduled copies of this workflow never run.
    if: github.repository == 'qyronx558/Chayan'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Look for pending contact notifications
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || ! command -v psql > /dev/null; then
            echo "No database access here: calling the site."
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # psql rejects Prisma-only URL options (schema, pgbouncer, connection_limit...):
          # keep only the ones libpq understands.
          base=${DATABASE_URL%%\?*}
          query=""
          schema=public
          if [ "$base" != "$DATABASE_URL" ]; then
            IFS='&' read -ra parts <<< "${DATABASE_URL#*\?}"
            for p in "${parts[@]}"; do
              case "$p" in
                sslmode=*|channel_binding=*|sslrootcert=*|options=*) query="$query&$p" ;;
                schema=*) schema=${p#schema=} ;;
              esac
            done
          fi
          url="$base${query:+?${query#&}}"
          export PGOPTIONS="-c search_path=$schema"
          # Same filter as /api/cron/contact. Prisma stores DateTime as UTC without a time zone.
          # Expired rate-limit rows are cleared here too, so the site never has to wake up for that.
          if ! pending=$(psql "$url" -X -q -t -A -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM "ContactRateLimit" WHERE "expiresAt" < (now() AT TIME ZONE 'utc');
          SELECT count(*) FROM "ContactTicket"
           WHERE "nextAttemptAt" <= (now() AT TIME ZONE 'utc')
             AND "deliveryAttempts" < 10
             AND "createdAt" > (now() AT TIME ZONE 'utc') - interval '23 hours'
             AND ("notifiedAt" IS NULL OR "autoRepliedAt" IS NULL);
          SQL
          ); then
            echo "::warning::Database check failed: calling the site."
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending=$(echo "$pending" | tail -n 1 | tr -d '[:space:]')
          echo "Pending tickets: $pending"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Retry pending contact notifications
        if: steps.check.outputs.pending != '0'
        # A failed retry is reported but never stops the feed sync below.
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          # Follow the site's own redirect (e.g. apex -> www) first: curl would otherwise get a 308
          # and never reach the endpoint (and must not resend the secret to another host).
          base=$(curl -s -o /dev/null -L --max-redirs 5 --max-time 30 -w '%{url_effective}' "${APP_URL%/}/")
          base=${base%/}
          echo "Site: $base"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$base/api/cron/contact"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Sync due job feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_CONTACT: ${{ vars.BOT_CONTACT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the Production environment."
            exit 1
          fi
          npm run feeds
