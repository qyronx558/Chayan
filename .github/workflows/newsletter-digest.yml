name: newsletter-digest

on:
  schedule:
    # 02:30 UTC = 08:00 IST, Mon/Wed/Fri/Sat
    - cron: "30 2 * * 1,3,5,6"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger newsletter digest
        run: |
          code=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            --max-time 55 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/newsletter")
          cat /tmp/digest.json
          if [ "$code" -ge 400 ]; then
            echo "digest trigger failed with HTTP $code"
            exit 1
          fi
