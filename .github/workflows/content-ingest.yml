name: content-ingest

# Free all-India government content pipeline (see docs/content-ingest.md):
#   scripts/ingest/run.ts → official notices → Gemini extraction → verify, score, store
# Everything runs here, inside GitHub Actions, straight against the database (DATABASE_URL in the
# Production environment). Vercel is touched once per run, and only when posts were auto-approved:
# one POST /api/cron/revalidate per content kind. Pending posts cost Vercel nothing.
# Posts land in the admin review queue (moderation PENDING) unless the auto-approve policy allows them.
# Set the repository variable INGEST_TRANSPORT=http to fall back to posting through /api/cron/ingest.
#
# Production environment secrets: DATABASE_URL, APP_URL, CRON_SECRET, GEMINI_API_KEY, GROQ_API_KEY (optional)
# Repo secrets for the http fallback / target=dev: INGEST_SECRET, DEV_APP_URL, DEV_INGEST_SECRET
# Optional repo variables: INGEST_EXTERNAL_SCHEDULER, INGEST_DISTRICT_RUNNER, INGEST_TRANSPORT, GEMINI_MODEL, GROQ_MODEL

# On-time schedule: GitHub's cron often starts these hours late. For exact times, have a free external
# cron (cron-job.org) start this workflow through GitHub's API directly, so Vercel is never woken up:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/content-ingest.yml/dispatches
#   Headers: Authorization: Bearer <fine-grained PAT, Actions: read & write>
#            Accept: application/vnd.github+json
#   every 4 h   {"ref":"main","inputs":{"target":"production","tier":"frequent","dry_run":"false","scheduled":"true"}}
#   06:00 IST   {"ref":"main","inputs":{"target":"production","tier":"district","dry_run":"false","scheduled":"true"}}
#   00:15 IST   {"ref":"main","inputs":{"target":"production","tier":"expire","dry_run":"false","scheduled":"true"}}
# then set the repository variable INGEST_EXTERNAL_SCHEDULER=true so the GitHub crons below
# stop (they are only the backup), and remove the old cron-job.org jobs that call the site.

on:
  schedule:
    - cron: "15 */4 * * *"   # central + state boards, every 4h
    - cron: "30 0 * * *"     # 06:00 IST - all district portals, 4 shards
    - cron: "45 18 * * *"    # 00:15 IST - expire jobs whose last date passed
  workflow_dispatch:
    inputs:
      target:
        description: "Which site receives the posts"
        type: choice
        options: [dev, production]
        default: dev
      tier:
        description: "Sources to crawl"
        type: choice
        options: [central, state, frequent, district, all, expire]
        default: central
      source:
        description: "Optional single source id (e.g. nic:bihar/patna) - overrides tier"
        type: string
        required: false
      dry_run:
        description: "Only list + extract, send nothing"
        type: boolean
        default: true
      scheduled:
        description: "Treat as a scheduled run (honours the admin pause / tier switches) - used by the external scheduler"
        type: boolean
        default: false

permissions:
  contents: read

# One run per site at a time; a second one waits (no two runs extract the same notice at once).
concurrency:
  group: content-ingest-${{ inputs.target || 'production' }}${{ (github.event.schedule == '45 18 * * *' || inputs.tier == 'expire') && '-expire' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    # GitHub's cron is the backup scheduler: skipped once INGEST_EXTERNAL_SCHEDULER=true.
    # The repository check keeps forks' scheduled copies of this workflow from running.
    if: >-
      github.repository == 'qyronx558/Chayan' &&
      github.event.schedule != '45 18 * * *' && inputs.tier != 'expire' &&
      (github.event_name != 'schedule' || vars.INGEST_EXTERNAL_SCHEDULER != 'true')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TIER: ${{ inputs.tier }}
          SOURCE: ${{ inputs.source }}
          DISTRICT_RUNNER: ${{ vars.INGEST_DISTRICT_RUNNER }}
        run: |
          if [ -n "$SOURCE" ]; then
            m="[\"--source=$SOURCE\"]"
          elif [ "$SCHEDULE" = "30 0 * * *" ] || [ "$TIER" = "district" ]; then
            m='["--tier=district --shard=1/4","--tier=district --shard=2/4","--tier=district --shard=3/4","--tier=district --shard=4/4"]'
          elif [ "$TIER" = "all" ]; then
            m='["--tier=central","--tier=state","--tier=district --shard=1/4","--tier=district --shard=2/4","--tier=district --shard=3/4","--tier=district --shard=4/4"]'
          elif [ "$TIER" = "frequent" ]; then
            m='["--tier=central","--tier=state"]'
          elif [ "$TIER" = "state" ]; then
            m='["--tier=state"]'
          elif [ -z "$SCHEDULE" ]; then
            m='["--tier=central"]'
          else
            m='["--tier=central","--tier=state"]'
          fi
          # District PDFs are blocked outside India: without an India runner, district shards
          # would only spend time and LLM quota for nothing, so they are left out.
          if [ -z "$DISTRICT_RUNNER" ] && [ -z "$SOURCE" ] && echo "$m" | grep -q -- '--tier=district'; then
            m=$(echo "$m" | jq -c '[.[] | select(test("--tier=district") | not)]')
            echo "::notice::District shards skipped: set the INGEST_DISTRICT_RUNNER variable to a self-hosted runner in India to crawl them."
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  ingest:
    needs: plan
    # An empty matrix (only district shards, no India runner) has nothing to run.
    if: needs.plan.outputs.matrix != '[]'
    # District notice PDFs sit on cdn.s3waas.gov.in, whose robots.txt blocks every visitor
    # outside India (GitHub's hosted runners are in the US). Set the repository variable
    # INGEST_DISTRICT_RUNNER to the label of a self-hosted runner in India (e.g. "india") and
    # district shards run there; everything else stays on GitHub's runners.
    # The repo is public: a self-hosted runner is only safe because this workflow never runs
    # on pull requests (schedule / workflow_dispatch only). Keep it that way.
    runs-on: ${{ contains(matrix.args, '--tier=district') && vars.INGEST_DISTRICT_RUNNER || 'ubuntu-latest' }}
    environment: Production
    timeout-minutes: 45
    defaults:
      run:
        shell: bash  # also on a Windows self-hosted runner (Git Bash)
    strategy:
      fail-fast: false
      # Sequential shards share one LLM key - parallel shards would just hit its per-minute limit.
      max-parallel: 1
      matrix:
        args: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Run ingest
        env:
          # target=dev never gets the production database: it posts to DEV_APP_URL over http instead.
          DATABASE_URL: ${{ inputs.target != 'dev' && secrets.DATABASE_URL || '' }}
          INGEST_TRANSPORT: ${{ vars.INGEST_TRANSPORT }}
          APP_URL: ${{ inputs.target != 'dev' && secrets.APP_URL || '' }}
          CRON_SECRET: ${{ inputs.target != 'dev' && secrets.CRON_SECRET || '' }}
          INGEST_API_URL: ${{ inputs.target == 'dev' && secrets.DEV_APP_URL || secrets.APP_URL }}
          INGEST_SECRET: ${{ inputs.target == 'dev' && secrets.DEV_INGEST_SECRET || secrets.INGEST_SECRET }}
          INGEST_PUBLIC_URL: ${{ secrets.APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional repository *variables* (Settings → Variables): change the model without a code change.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Scheduled runs obey the pause / tier switches in Admin → Content bot; manual runs always go.
          INGEST_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ARGS: ${{ matrix.args }}
        run: |
          direct=true
          if [ -z "$DATABASE_URL" ] || [ "$INGEST_TRANSPORT" = "http" ]; then direct=false; fi
          if [ -z "$DRY_RUN" ] && [ "$direct" = false ] && { [ -z "$INGEST_API_URL" ] || [ -z "$INGEST_SECRET" ]; }; then
            echo "::error::Set DATABASE_URL in the Production environment (direct mode), or APP_URL / INGEST_SECRET (DEV_APP_URL / DEV_INGEST_SECRET for target=dev)."
            exit 1
          fi
          if [ "$direct" = true ]; then echo "Mode: direct database (Vercel only refreshes pages for published posts)"; else echo "Mode: http via the site"; fi
          # shellcheck disable=SC2086
          npx tsx scripts/ingest/run.ts $ARGS $DRY_RUN

      - name: Keep dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ingest-dry-run-${{ strategy.job-index }}
          path: ingest-dry-run.json
          if-no-files-found: ignore
          retention-days: 7

  expire-jobs:
    # Runs here against the database; the site is only asked to refresh listings if something expired.
    if: >-
      github.repository == 'qyronx558/Chayan' && (
      (github.event.schedule == '45 18 * * *' && vars.INGEST_EXTERNAL_SCHEDULER != 'true') ||
      (inputs.tier == 'expire' && inputs.target != 'dev' && !inputs.dry_run))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Expire closed jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the Production environment."
            exit 1
          fi
          npx tsx scripts/ingest/expire.ts
